<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Pozadinski gradijent -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Zlatno-narandžasti gradijent za mehanizaciju -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Smaragdni gradijent za servis i status -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Plavi gradijent za logistiku -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Efekat sjaja -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glavni zaobljeni kvadrat (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Unutrašnja kružna platforma / zupčanik akcenat -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-dasharray="16 12" opacity="0.35" />

  <!-- 1. VILJUŠKAR / SKLADIŠNA MEHANIZACIJA (Centralni simbol) -->
  <g transform="translate(48, 44)">
    <!-- Zaštitni krov / kabina viljuškara -->
    <path d="M 170 120 L 250 120 C 270 120 285 135 285 155 L 285 240 L 155 240 L 155 135 C 155 126 162 120 170 120 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Šasija viljuškara i teg nazad -->
    <path d="M 120 240 L 300 240 C 315 240 325 250 325 265 L 320 310 C 320 320 310 330 300 330 L 130 330 C 115 330 105 320 105 305 L 110 255 C 110 245 115 240 120 240 Z" 
          fill="url(#goldGrad)" filter="url(#glow)" />

    <!-- Kran viljuškara (Vertikalni stubovi sprijeda) -->
    <line x1="90" y1="90" x2="90" y2="330" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" />
    <line x1="60" y1="90" x2="60" y2="330" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />
    <!-- Prečke na kranu -->
    <line x1="55" y1="140" x2="95" y2="140" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
    <line x1="55" y1="200" x2="95" y2="200" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
    
    <!-- Viljuške (Horizontalni nosač i zubi viljuški) -->
    <path d="M 20 280 L 75 280 L 75 200" fill="none" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pogonski točkovi (Smaragdni i crni industrijski točkovi) -->
    <!-- Prednji točak -->
    <circle cx="130" cy="335" r="36" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="12" />
    <circle cx="130" cy="335" r="14" fill="#34d399" />
    <!-- Zadnji točak -->
    <circle cx="280" cy="335" r="30" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="10" />
    <circle cx="280" cy="335" r="12" fill="#34d399" />
  </g>

  <!-- 2. SERVISNI KLJUČ / RADIONICA AKCENAT (Dijagonalno ukršten sa desne strane) -->
  <g transform="translate(240, 200) rotate(-35)">
    <!-- Osovina ključa -->
    <rect x="70" y="-12" width="130" height="24" rx="8" fill="url(#blueGrad)" />
    <!-- Glava ključa (otvoreni zupčasti prihvat) -->
    <path d="M 75 -24 C 60 -36 35 -36 20 -20 C 5 -5 5 20 20 35 C 35 50 60 50 75 38 L 52 22 C 45 16 45 6 52 0 Z" 
          fill="url(#blueGrad)" filter="url(#glow)" />
  </g>

  <!-- 3. BINGO ŽIG / LOGO 'B' MINIATURA GORE DESNO -->
  <circle cx="400" cy="112" r="44" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <text x="400" y="128" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">B</text>
</svg>
